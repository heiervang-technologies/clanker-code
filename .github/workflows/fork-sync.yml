name: Fork Sync

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: clanker-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    uses: heiervang-technologies/.github/.github/workflows/fork-sync-reusable.yml@main
    with:
      upstream_repo: "openai/codex"
      upstream_branch: "main"
      fork_branch: "clanker"
      # clanker integrates upstream by merge (see 2026-11-01 upstream sync), so
      # it must never be rebased: a rebase would rewrite published history.
      # This workflow only fast-forwards main; merge main into clanker by PR.
      skip_rebase: true
