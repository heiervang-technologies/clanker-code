[package]
edition.workspace = true
license.workspace = true
name = "codex-code-mode"
version.workspace = true

[lib]
doctest = false
name = "codex_code_mode"
path = "src/lib.rs"

[features]
default = ["in-process-v8"]
# Embeds V8 so code-mode cells can run in-process. Without it, sessions are
# only available through an out-of-process `codex-code-mode-host`. Android
# builds omit it because rusty_v8 ships no prebuilt Android archives.
in-process-v8 = ["dep:deno_core_icudata", "dep:v8"]
sandbox = ["in-process-v8", "v8/v8_enable_sandbox"]

[lints]
workspace = true

[dependencies]
codex-code-mode-protocol = { workspace = true }
codex-protocol = { workspace = true }
deno_core_icudata = { workspace = true, optional = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
v8 = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
