packages:
  - codex-cli
  - codex-rs/responses-api-proxy/npm
  - sdk/typescript

ignoredBuiltDependencies:
  - esbuild

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@babel/core'
  - '@hono/node-server'
  - ajv
  - body-parser
  - brace-expansion
  - diff
  - fast-uri
  - hono
  - ip-address
  - js-yaml
  - postcss
  - qs
  - yaml

blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude: []
allowBuilds: {}
